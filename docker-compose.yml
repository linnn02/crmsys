services:
  db:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/init-env.mjs}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 15
  migrate:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-crm}
    command: [npm, run, db:migrate]
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-crm}
      JWT_SECRET: ${JWT_SECRET:?Run node scripts/init-env.mjs}
      WEB_ORIGIN: ${DOCKER_WEB_ORIGIN:-http://localhost:8080}
      SEED_PASSWORD: ${SEED_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'fetch("http://localhost:4000/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build:
      context: .
      target: web
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
